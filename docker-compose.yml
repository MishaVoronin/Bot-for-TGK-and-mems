services:
  bot:
    build: .
    container_name: bot
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - bot_network

  db:
    image: postgres:16-alpine
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bot_network
    ports:
      - "5432:5432"

volumes:
  postgres_data:

networks:
  bot_network:
    driver: bridge