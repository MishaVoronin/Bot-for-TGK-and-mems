[project]
name = "bot-for-tgk-and-mems"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.30.0",
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "dotenv>=0.9.9",
    "psycopg[binary]>=3.3.4",
    "sqlalchemy>=2.0.52",
    "uvloop>=0.22.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"